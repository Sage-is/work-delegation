<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="The liner sends a folded brief across the water to the tug; the tug sends back a diff, a page marked with red and gold lines.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#12293b"/></marker>
    <clipPath id="inner"><rect x="14" y="14" width="1252" height="352"/></clipPath>
  </defs>
  <rect width="1280" height="380" fill="#12293b"/>
  <rect x="14" y="14" width="1252" height="352" fill="#f4e9d0"/>
  <g clip-path="url(#inner)">
    <!-- sunburst: filled wedges, as the hero -->
    <g fill="#e8b64c" opacity=".16">
      <path d="M640,262 L14,60 L14,130 Z M640,262 L130,14 L230,14 Z M640,262 L390,14 L470,14 Z M640,262 L600,14 L680,14 Z M640,262 L810,14 L890,14 Z M640,262 L1050,14 L1150,14 Z M640,262 L1266,60 L1266,130 Z"/>
    </g>
    <circle cx="640" cy="266" r="64" fill="#e8b64c"/>
    <!-- sea -->
    <rect x="14" y="262" width="1252" height="40" fill="#3d5a6e"/>
    <rect x="14" y="300" width="1252" height="34" fill="#1a3a50"/>
    <rect x="14" y="334" width="1252" height="32" fill="#12293b"/>
    <g stroke="#f4e9d0" stroke-width="1.5" fill="none" opacity=".45">
      <path d="M40,282 q30,-8 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
      <path d="M20,318 q30,-8 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
    </g>
    <!-- liner, bow to the left, funnels raked aft -->
    <g>
      <line x1="152" y1="206" x2="152" y2="112" stroke="#12293b" stroke-width="3"/>
      <path d="M154,118 L188,130 L154,142 Z" fill="#c8502e"/>
      <rect x="150" y="204" width="200" height="24" fill="#f4e9d0" stroke="#12293b" stroke-width="2"/>
      <rect x="110" y="228" width="330" height="34" fill="#f4e9d0" stroke="#12293b" stroke-width="2"/>
      <g fill="#c8502e"><path d="M200,204 L226,204 L232,160 L206,160 Z"/><path d="M250,204 L276,204 L282,160 L256,160 Z"/><path d="M300,204 L326,204 L332,160 L306,160 Z"/></g>
      <g fill="#12293b"><path d="M204,164 L234,164 L236,156 L206,156 Z"/><path d="M254,164 L284,164 L286,156 L256,156 Z"/><path d="M304,164 L334,164 L336,156 L306,156 Z"/></g>
      <g fill="#12293b">
        <circle cx="130" cy="245" r="3"/><circle cx="154" cy="245" r="3"/><circle cx="178" cy="245" r="3"/><circle cx="202" cy="245" r="3"/><circle cx="226" cy="245" r="3"/><circle cx="250" cy="245" r="3"/><circle cx="274" cy="245" r="3"/><circle cx="298" cy="245" r="3"/><circle cx="322" cy="245" r="3"/><circle cx="346" cy="245" r="3"/><circle cx="370" cy="245" r="3"/><circle cx="394" cy="245" r="3"/><circle cx="418" cy="245" r="3"/>
      </g>
      <path d="M70,262 L96,302 L470,302 L500,262 Z" fill="#12293b"/>
      <rect x="76" y="262" width="418" height="9" fill="#c8502e"/>
    </g>
    <!-- tug, bow to the left, smoke trailing aft -->
    <g>
      <g fill="#12293b" opacity=".5"><circle cx="1062" cy="194" r="5"/><circle cx="1074" cy="182" r="6"/><circle cx="1088" cy="171" r="7"/><circle cx="1104" cy="162" r="8"/></g>
      <path d="M1052,236 L1066,236 L1070,206 L1056,206 Z" fill="#c8502e"/>
      <path d="M1054,210 L1072,210 L1073,204 L1055,204 Z" fill="#12293b"/>
      <rect x="1030" y="236" width="56" height="26" fill="#f4e9d0" stroke="#12293b" stroke-width="2"/>
      <rect x="1040" y="243" width="10" height="8" fill="#12293b"/><rect x="1058" y="243" width="10" height="8" fill="#12293b"/>
      <path d="M990,262 L1006,292 L1124,292 L1146,262 Z" fill="#12293b"/>
      <rect x="994" y="262" width="148" height="8" fill="#c8502e"/>
      <path d="M992,264 q-14,10 -30,6" stroke="#f4e9d0" stroke-width="2" fill="none" opacity=".7"/>
    </g>
    <!-- the brief, liner to tug -->
    <path d="M170,120 Q640,50 1040,200" fill="none" stroke="#12293b" stroke-width="2.5" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
    <g transform="translate(598,44) rotate(6) scale(1.5)">
      <rect x="3" y="3" width="44" height="56" fill="#12293b" opacity=".18"/>
      <rect x="0" y="0" width="44" height="56" fill="#f4e9d0" stroke="#12293b" stroke-width="2"/>
      <path d="M32,0 L44,12 L32,12 Z" fill="#12293b"/>
      <g stroke="#12293b" stroke-width="2"><line x1="8" y1="22" x2="34" y2="22"/><line x1="8" y1="30" x2="34" y2="30"/><line x1="8" y1="38" x2="26" y2="38"/></g>
    </g>
    <!-- the diff, tug back to liner, riding above the waterline -->
    <path d="M1000,244 Q760,262 520,244" fill="none" stroke="#12293b" stroke-width="2.5" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
    <g transform="translate(722,170) rotate(-5) scale(1.5)">
      <rect x="3" y="3" width="44" height="56" fill="#12293b" opacity=".18"/>
      <rect x="0" y="0" width="44" height="56" fill="#f4e9d0" stroke="#12293b" stroke-width="2"/>
      <rect x="8" y="12" width="26" height="6" fill="#c8502e"/>
      <rect x="8" y="24" width="26" height="6" fill="#e8b64c"/>
      <rect x="8" y="36" width="18" height="6" fill="#e8b64c"/>
    </g>
  </g>
  <!-- the hero's frame: a rule on the mat and a hairline at the picture edge -->
  <rect x="7.5" y="7.5" width="1265" height="365" fill="none" stroke="#d9a441" stroke-width="3"/>
  <rect x="14.5" y="14.5" width="1251" height="351" fill="none" stroke="#d9a441" stroke-width="1"/>
</svg>
